<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>

    <main class="app-content" data-auth-guard>
      <div class="page-head">
        <div>
          <div class="breadcrumb-eyebrow">Monetization</div>
          <h1>Ads</h1>
          <div class="lede">Manage the ad slots running across the site.</div>
        </div>
        <div class="page-head-actions">
          <button class="btn btn-desk-gold" id="addAdBtn"><i class="bi bi-plus-lg me-1"></i> Add Ad</button>
        </div>
      </div>

      <div class="row g-3" id="adsGrid">
        <div class="col-12 text-center text-soft py-5">Loading…</div>
      </div>
    </main>
  </div>
</div>

<!-- Add / Edit Ad Modal -->
<div class="modal fade" id="adModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content desk-modal">
      <form id="adForm" novalidate>
        <input type="hidden" id="adId">
        <div class="modal-header">
          <h5 class="modal-title" id="adModalLabel">Add Ad</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="adTitle">Campaign Title <span class="required-mark">*</span></label>
            <input type="text" class="form-control" id="adTitle" required maxlength="80">
            <div class="invalid-feedback">A title is required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="adLink">Destination Link <span class="required-mark">*</span></label>
            <input type="url" class="form-control" id="adLink" placeholder="https://" required>
            <div class="invalid-feedback">Please enter a valid URL.</div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label" for="adPlacement">Placement</label>
              <select class="form-select" id="adPlacement">
                <option value="header">Header Banner</option>
                <option value="sidebar">Sidebar</option>
                <option value="in-article">In-Article</option>
                <option value="footer">Footer</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="adStatus">Status</label>
              <select class="form-select" id="adStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div>
            <label class="form-label">Creative</label>
            <div class="upload-drop" id="adDropzone">
              <i class="bi bi-cloud-arrow-up d-block mb-2"></i>
              Drop an image here, or click to browse
            </div>
            <div class="media-preview-frame mt-2" id="adFrame" style="display:none;"></div>
            <input type="file" id="adImageInput" accept="image/*" hidden>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-desk" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-desk-gold" id="adSubmitBtn">Save Ad</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/upload.js"></script>
<script src="js/ads.js"></script>
</body>
</html>
