<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>

    <main class="app-content" data-auth-guard>
      <div class="page-head">
        <div>
          <div class="breadcrumb-eyebrow">Front Page</div>
          <h1>Dashboard</h1>
          <div class="lede">Today's edition at a glance.</div>
        </div>
        <a href="add-news.html" class="btn btn-desk-gold"><i class="bi bi-file-earmark-plus me-1"></i> New Article</a>
      </div>

      <div class="row g-3 mb-4" id="statGrid">
        <!-- filled by dashboard.js -->
      </div>

      <div class="desk-card">
        <div class="desk-card-head">
          <h2><i class="bi bi-clock-history me-2"></i>Recent Articles</h2>
          <a href="manage-news.html" class="btn btn-outline-desk btn-sm">View all <i class="bi bi-arrow-right ms-1"></i></a>
        </div>
        <div class="table-responsive">
          <table class="table table-desk table-responsive-cards mb-0">
            <thead>
              <tr>
                <th>Article</th>
                <th>Author</th>
                <th>Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recentNewsBody">
              <tr><td colspan="4" class="text-center text-soft py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
