<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="auth-screen">
  <div class="auth-visual">
    <div class="masthead">
      <small>The Desk — Admin Console</small>
      Where every story<br>gets to press.
    </div>
    <div class="edition-line">
      VOL. 1 &nbsp;·&nbsp; NEWSROOM CONTROL PANEL &nbsp;·&nbsp; SECURE SIGN-IN
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="masthead-rule mb-4"><span>Admin Access</span></div>
      <h1 class="mb-1" style="font-size:1.7rem;">Sign in to the desk</h1>
      <p class="text-soft mb-4">Enter your editorial credentials to continue.</p>

      <div class="alert alert-danger d-none py-2 small" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email address</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="editor@newspaper.com" required autocomplete="username">
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required minlength="4" autocomplete="current-password">
            <button class="btn btn-outline-desk" type="button" id="togglePassword" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
          <div class="invalid-feedback">Please enter your password.</div>
        </div>
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small text-soft" for="rememberMe">Keep me signed in</label>
          </div>
        </div>
        <button type="submit" class="btn btn-desk-gold w-100 py-2" id="loginSubmitBtn">
          Sign In <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>

      <p class="text-center text-soft small mt-4 mb-0">Authorized newsroom staff only.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => Auth.initLoginForm());
</script>
</body>
</html>
