<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>

    <main class="app-content" data-auth-guard>
      <div class="page-head">
        <div>
          <div class="breadcrumb-eyebrow">Audience</div>
          <h1>Users</h1>
          <div class="lede">Everyone with an account on the site.</div>
        </div>
      </div>

      <div class="filter-bar">
        <input type="search" class="form-control" id="userFilterSearch" placeholder="Search by name or email…">
        <select class="form-select" id="userFilterRole">
          <option value="">All roles</option>
          <option value="admin">Admin</option>
          <option value="editor">Editor</option>
          <option value="reader">Reader</option>
        </select>
        <select class="form-select" id="userFilterStatus">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="blocked">Blocked</option>
        </select>
      </div>

      <div class="desk-card">
        <div class="desk-card-head">
          <h2><i class="bi bi-people me-2"></i>All Users</h2>
          <span class="result-count" id="resultCount">Loading…</span>
        </div>
        <div class="table-responsive">
          <table class="table table-desk table-responsive-cards mb-0">
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="5" class="text-center text-soft py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="desk-pagination">
          <span class="result-count">&nbsp;</span>
          <nav id="usersPagination"></nav>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content desk-modal">
      <form id="userForm" novalidate>
        <input type="hidden" id="userId">
        <div class="modal-header">
          <h5 class="modal-title">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="userName">Full Name</label>
            <input type="text" class="form-control" id="userName" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="userEmail">Email</label>
            <input type="email" class="form-control" id="userEmail" disabled>
            <div class="form-hint">Email cannot be changed here.</div>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="userRole">Role</label>
              <select class="form-select" id="userRole">
                <option value="admin">Admin</option>
                <option value="editor">Editor</option>
                <option value="reader">Reader</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="userStatus">Status</label>
              <select class="form-select" id="userStatus">
                <option value="active">Active</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-desk" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-desk-gold" id="userSubmitBtn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/users.js"></script>
</body>
</html>
