<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>

    <main class="app-content" data-auth-guard>
      <div class="page-head">
        <div>
          <div class="breadcrumb-eyebrow">Editorial</div>
          <h1>Categories</h1>
          <div class="lede">The sections your newsroom publishes under.</div>
        </div>
        <div class="page-head-actions">
          <button class="btn btn-desk-gold" id="addCategoryBtn"><i class="bi bi-plus-lg me-1"></i> Add Category</button>
        </div>
      </div>

      <div class="filter-bar">
        <input type="search" class="form-control" id="categorySearch" placeholder="Search categories…">
      </div>

      <div class="row g-3" id="categoryGrid">
        <div class="col-12 text-center text-soft py-5">Loading…</div>
      </div>
    </main>
  </div>
</div>

<!-- Add / Edit Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content desk-modal">
      <form id="categoryForm" novalidate>
        <input type="hidden" id="categoryId">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryModalLabel">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="categoryName">Name <span class="required-mark">*</span></label>
            <input type="text" class="form-control" id="categoryName" required maxlength="60">
            <div class="invalid-feedback">Category name is required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="categorySlug">Slug</label>
            <input type="text" class="form-control" id="categorySlug" placeholder="auto-generated-from-name">
            <div class="form-hint">Used in article URLs. Auto-filled from the name.</div>
          </div>
          <div class="mb-0">
            <label class="form-label" for="categoryDescription">Description</label>
            <textarea class="form-control" id="categoryDescription" rows="3" maxlength="200"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-desk" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-desk-gold" id="categorySubmitBtn">Save Category</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/category.js"></script>
</body>
</html>
