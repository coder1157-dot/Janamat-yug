<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage News · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>

    <main class="app-content" data-auth-guard>
      <div class="page-head">
        <div>
          <div class="breadcrumb-eyebrow">Editorial</div>
          <h1>Manage News</h1>
          <div class="lede">Every article on the wire, in one place.</div>
        </div>
        <div class="page-head-actions">
          <a href="add-news.html" class="btn btn-desk-gold"><i class="bi bi-file-earmark-plus me-1"></i> New Article</a>
        </div>
      </div>

      <div class="filter-bar">
        <input type="search" class="form-control" id="newsFilterSearch" placeholder="Search articles…">
        <select class="form-select" id="newsFilterCategory"></select>
        <select class="form-select" id="newsFilterStatus">
          <option value="">All statuses</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>

      <div class="desk-card">
        <div class="desk-card-head">
          <h2><i class="bi bi-newspaper me-2"></i>Articles</h2>
          <span class="result-count" id="resultCount">Loading…</span>
        </div>
        <div class="table-responsive">
          <table class="table table-desk table-responsive-cards mb-0">
            <thead>
              <tr>
                <th>Article</th>
                <th>Category</th>
                <th>Author</th>
                <th>Published</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="newsTableBody">
              <tr><td colspan="6" class="text-center text-soft py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="desk-pagination">
          <span class="result-count" id="paginationHint">&nbsp;</span>
          <nav id="newsPagination"></nav>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/news.js"></script>
</body>
</html>
