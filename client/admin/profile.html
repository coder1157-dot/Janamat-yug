<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile · The Desk Admin</title>
<link rel="icon" href="assets/placeholder-thumb.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="css/admin.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>

  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>

    <main class="app-content" data-auth-guard>
      <div class="page-head">
        <div>
          <div class="breadcrumb-eyebrow">System</div>
          <h1>My Profile</h1>
          <div class="lede">Your byline and account details.</div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="desk-card">
            <div class="desk-card-body text-center">
              <div class="avatar-upload mx-auto mb-3" id="profileAvatarWrap">
                <span id="profileAvatarInitials">A</span>
              </div>
              <div class="cell-title fs-5" id="profileDisplayName">—</div>
              <div class="cell-meta" id="profileDisplayRole">Administrator</div>
              <hr class="my-3" style="border-color: var(--rule);">
              <div class="text-start">
                <div class="d-flex justify-content-between py-1">
                  <span class="text-soft small">Member since</span>
                  <span class="text-mono small" id="profileJoinedDisplay">—</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="desk-card mb-3">
            <div class="desk-card-head"><h2><i class="bi bi-person-lines-fill me-2"></i>Account Details</h2></div>
            <div class="desk-card-body">
              <form id="profileForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="profileName">Full Name</label>
                    <input type="text" class="form-control" id="profileName">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="profileEmail">Email</label>
                    <input type="email" class="form-control" id="profileEmail" disabled>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="profileRole">Role</label>
                    <input type="text" class="form-control" id="profileRole" disabled>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="profileJoined">Joined</label>
                    <input type="text" class="form-control" id="profileJoined" disabled>
                  </div>
                </div>
                <div class="d-flex justify-content-end mt-3">
                  <button type="submit" class="btn btn-desk-gold">Save Changes</button>
                </div>
              </form>
            </div>
          </div>

          <div class="desk-card">
            <div class="desk-card-head"><h2><i class="bi bi-shield-lock me-2"></i>Change Password</h2></div>
            <div class="desk-card-body">
              <form id="passwordForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label" for="currentPassword">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" autocomplete="current-password">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" autocomplete="new-password">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password">
                  </div>
                </div>
                <div class="d-flex justify-content-end mt-3">
                  <button type="submit" class="btn btn-outline-desk">Update Password</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
