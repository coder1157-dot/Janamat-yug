<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>लॉगिन | जनमत युग</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="jy-topbar">
  <div class="container-jy d-flex justify-content-between align-items-center">
    <span class="jy-topbar-date" id="topbarDate">आज की तारीख</span>
    <div id="authArea" class="jy-topbar-auth"></div>
  </div>
</div>

<header class="jy-masthead">
  <div class="container-jy jy-masthead-inner">
    <!-- Logo -->
        <a href="index.html" class="jy-logo-box">
            <img src="assets/img/logo.png"
                 class="jy-logo-img"
                 alt="Janamat Yug">
        </a>
    <span class="jy-masthead-rule"></span>
    <div><a href="index.html" class="text-decoration-none"><div class="jy-logo"><span>ज</span>नमत युग</div></a>
      <div class="jy-tagline">सच कहने का साहस</div>
    </div>
    <span class="jy-masthead-rule"></span>
  </div>
</header>

<main class="jy-auth-wrap">
  <div class="jy-auth-card">
    <h2>लॉगिन करें</h2>
    <p class="jy-auth-sub">अपने खाते में साइन इन करें और अपनी पसंदीदा खबरें पढ़ें</p>

    <div class="alert alert-danger d-none" id="authError" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="loginEmail" class="form-label">ईमेल पता</label>
        <input type="email" class="form-control" id="loginEmail" required>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">पासवर्ड</label>
        <input type="password" class="form-control" id="loginPassword" required minlength="6">
      </div>
      <button type="submit" class="btn btn-jy-primary w-100" id="loginSubmitBtn">लॉगिन करें</button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-family:var(--jy-font-ui); font-size:0.9rem;">
      खाता नहीं है? <a href="register.html">रजिस्टर करें</a>
    </p>
  </div>
</main>

<footer class="jy-footer">
  <div class="container-jy">
    <div class="jy-footer-bottom">© <span id="footerYear"></span> जनमत युग। सर्वाधिकार सुरक्षित।</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
