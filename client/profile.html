<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मेरी प्रोफ़ाइल | जनमत युग</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="jy-topbar">
  <div class="container-jy d-flex justify-content-between align-items-center">
    <span class="jy-topbar-date" id="topbarDate">आज की तारीख</span>
    <div id="authArea" class="jy-topbar-auth"></div>
  </div>
</div>

<header class="jy-masthead">
  <div class="container-jy jy-masthead-inner">
    <!-- Logo -->
        <a href="index.html" class="jy-logo-box">
            <img src="assets/img/logo.png"
                 class="jy-logo-img"
                 alt="Janamat Yug">
        </a>
    <span class="jy-masthead-rule"></span>
    <div><a href="index.html" class="text-decoration-none"><div class="jy-logo"><span>ज</span>नमत युग</div></a>
      <div class="jy-tagline">सच कहने का साहस</div>
    </div>
    <span class="jy-masthead-rule"></span>
  </div>
</header>

<nav class="navbar navbar-expand-lg jy-navbar">
  <div class="container">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="मेनू खोलें">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">होम</a></li>
        <li class="nav-item"><a class="nav-link" href="bookmark.html">बुकमार्क</a></li>
        <li class="nav-item"><a class="nav-link active" href="profile.html">प्रोफ़ाइल</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-jy jy-section" style="max-width:820px;">
  <div class="jy-profile-header">
    <div class="jy-profile-avatar" id="profileAvatar">उ</div>
    <div>
      <h2 class="mb-1" id="profileName">उपयोगकर्ता</h2>
      <p class="text-muted mb-1" id="profileEmail">—</p>
      <p class="mb-0" style="font-family:var(--jy-font-ui); font-size:0.85rem;">
        <i class="fa-solid fa-bookmark text-warning"></i> <span id="bookmarkCount">0</span> बुकमार्क समाचार
      </p>
    </div>
    <button class="btn btn-jy-outline ms-auto" id="profileLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> लॉगआउट</button>
  </div>

  <div class="jy-widget">
    <h5>प्रोफ़ाइल संपादित करें</h5>
    <form id="profileEditForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="editName" class="form-label">नाम</label>
          <input type="text" class="form-control" id="editName" required>
        </div>
        <div class="col-md-6">
          <label for="editEmail" class="form-label">ईमेल</label>
          <input
    type="email"
    class="form-control"
    id="editEmail"
    readonly
>
        </div>
      <button type="submit" class="btn btn-jy-primary mt-3" id="profileSaveBtn">परिवर्तन सहेजें</button>
    </form>
  </div>


<div class="jy-widget">

<h5>पासवर्ड बदलें</h5>

<form id="changePasswordForm">

    <div class="mb-3">
        <label>वर्तमान पासवर्ड</label>
        <input
            id="currentPassword"
            type="password"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label>नया पासवर्ड</label>
        <input
            id="newPassword"
            type="password"
            class="form-control"
            required>
    </div>

    <button
        type="submit"
        class="btn btn-jy-primary">
        पासवर्ड बदलें
    </button>

</form>

</div>

  <div class="jy-widget mb-0">
    <h5>त्वरित लिंक</h5>
    <a href="bookmark.html" class="btn btn-jy-outline me-2"><i class="fa-solid fa-bookmark"></i> मेरे बुकमार्क देखें</a>
    <a href="index.html" class="btn btn-jy-outline"><i class="fa-solid fa-house"></i> होमपेज पर जाएं</a>
  </div>
</main>

<footer class="jy-footer">
  <div class="container-jy">
    <div class="jy-footer-bottom">© <span id="footerYear"></span> जनमत युग। सर्वाधिकार सुरक्षित।</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/profile.js"></script>
</body>
</html>
